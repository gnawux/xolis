[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "xolis-runtime-python"
version = "0.1.0"
description = "Bounded Python runtime service for Xolis sandboxes"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "python-multipart==0.0.20",
    "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]
