apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: xolis-kata-pvm
  labels:
    app.kubernetes.io/part-of: xolis
    xolis.io/virtualization: pvm
handler: xolis-kata-pvm
scheduling:
  nodeSelector:
    xolis.io/kata-ready: "true"
    xolis.io/pvm-ready: "true"
    xolis.io/virtualization: pvm
  tolerations:
    - key: xolis.io/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: xolis.io/pvm
      operator: Equal
      value: "true"
      effect: NoSchedule
