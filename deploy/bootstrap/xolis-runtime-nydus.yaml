apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: xolis-kata-nydus
  labels:
    app.kubernetes.io/part-of: xolis
    xolis.io/image-mode: nydus
handler: xolis-kata-nydus
scheduling:
  nodeSelector:
    xolis.io/kata-ready: "true"
  tolerations:
    - key: xolis.io/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
