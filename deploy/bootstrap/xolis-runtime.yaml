apiVersion: v1
kind: Namespace
metadata:
  name: xolis-system
  labels:
    app.kubernetes.io/part-of: xolis
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: xolis-kata
  labels:
    app.kubernetes.io/part-of: xolis
handler: xolis-kata
scheduling:
  nodeSelector:
    xolis.io/kata-ready: "true"
  tolerations:
    - key: xolis.io/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
