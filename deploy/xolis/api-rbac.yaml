apiVersion: v1
kind: ServiceAccount
metadata:
  name: xolis-api
  namespace: xolis-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xolis-api-sandbox-claims
  namespace: xolis-sandboxes
rules:
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - create
      - delete
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xolis-api-sandbox-claims
  namespace: xolis-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xolis-api-sandbox-claims
subjects:
  - kind: ServiceAccount
    name: xolis-api
    namespace: xolis-system
