apiVersion: apps/v1
kind: Deployment
metadata:
  name: xolis-api
  namespace: xolis-system
  labels:
    app.kubernetes.io/name: xolis-api
    app.kubernetes.io/part-of: xolis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xolis-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xolis-api
        app.kubernetes.io/part-of: xolis
    spec:
      serviceAccountName: xolis-api
      automountServiceAccountToken: true
      nodeSelector:
        node-role.xolis.io/system: "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 479874045111.dkr.ecr.ap-northeast-1.amazonaws.com/xolis/xolis-api@sha256:0efdfe3c540b496827929069c73f31794fbe9e832ddbff7b33283d0ef1c03b82
          imagePullPolicy: IfNotPresent
          env:
            - name: XOLIS_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: XOLIS_STORE
              value: kubernetes
            - name: XOLIS_SANDBOX_NAMESPACE
              value: xolis-sandboxes
            - name: XOLIS_WARM_POOL
              value: python-basic-v1-pool
            - name: XOLIS_ROUTER_URL
              value: http://sandbox-router-svc.xolis-system.svc.cluster.local:8080
            - name: XOLIS_RUNTIME_PORT
              value: "8888"
            - name: XOLIS_MAXIMUM_TTL_SECONDS
              value: "7200"
            - name: XOLIS_MAXIMUM_COMMAND_TIMEOUT_SECONDS
              value: "300"
            - name: XOLIS_MAXIMUM_UPLOAD_BYTES
              value: "10485760"
            - name: RUST_LOG
              value: xolis_api=info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: xolis-api
  namespace: xolis-system
  labels:
    app.kubernetes.io/name: xolis-api
    app.kubernetes.io/part-of: xolis
spec:
  selector:
    app.kubernetes.io/name: xolis-api
  ports:
    - name: http
      port: 8080
      targetPort: http
