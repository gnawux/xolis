apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-router
  namespace: xolis-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-router-pod-cache
  namespace: xolis-sandboxes
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-router-pod-cache
  namespace: xolis-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-router-pod-cache
subjects:
  - kind: ServiceAccount
    name: sandbox-router
    namespace: xolis-system
